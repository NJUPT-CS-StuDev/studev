[versions]
agp = "9.5.0"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.10.0"
core = "1.18.0"
maplibre = "13.7.1"
work = "2.11.2"
glance = "1.1.1"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
maplibre = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }

# App dependencies are deliberately pinned alongside the platform/BOM versions.
androidx-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.9.8" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.2.1" }
material-icons = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
jna = { module = "net.java.dev.jna:jna", version = "5.19.1" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
