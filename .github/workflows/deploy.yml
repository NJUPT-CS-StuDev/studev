name: Deploy

# Deploys on every push to main, and hourly whenever campus-data has published
# a release the site is not serving yet.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.data.outputs.deploy }}
    steps:
      - id: data
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          location=$(curl -s -o /dev/null -w '%{redirect_url}' https://github.com/<data-repository>/releases/latest)
          version="${location##*/}"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://studev.hicancan.top/data/$version/timetable/index.json")
          echo "latest data $version, served: $status"
          if [ "$status" = "200" ]; then echo "deploy=false" >> "$GITHUB_OUTPUT"; else echo "deploy=true" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -y edgeone@1.6.44 makers env pull -e production -t "$EDGEONE_API_TOKEN"
      - run: npm run digest
      - run: npm run typecheck
      - run: npm run test:campus
      - run: npm run test:platform
      - run: npm run build
      - run: npx -y edgeone@1.6.44 makers deploy -n studev -t "$EDGEONE_API_TOKEN" --json
