name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify the public Android and Windows downloads
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/check-public.mjs
      - id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # EdgeOne counts every deployment against the account's monthly build minutes. Pushes settle for ten minutes first,
  # and a newer push cancels the wait, so a run of commits deploys once.
  settle:
    needs: distribution
    if: needs.distribution.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-settle
      cancel-in-progress: true
    steps:
      - if: github.event_name == 'push'
        run: sleep 600

  deploy:
    needs: [distribution, settle]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
    env:
      PAGES_SOURCE: skills
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      MAKERS_MODELS_KEY: ${{ secrets.MAKERS_MODELS_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.distribution.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure the platform runtime
        run: |
          # The CLI reports a missing project link and still exits 0, so link it first.
          mkdir -p .edgeone
          echo '{"Name":"studev","ProjectId":"makers-xubgsi8n79pp"}' > .edgeone/project.json
          # The EdgeOne API drops a call now and then, here as in the deploy below.
          makers() { for try in 1 2 3 4; do npx -y edgeone@1.6.44 makers "$@" -e production -t "$EDGEONE_API_TOKEN" && return 0; sleep $((try * 15)); done; return 1; }
          for name in MAKERS_MODELS_KEY NVIDIA_API_KEY RESEND_API_KEY; do
            makers env set "$name" "${!name}"
          done
          # The platform answers requests from the site's own origin, which product.json names.
          makers env set PLATFORM_ORIGIN "$(node -p "require('./product.json').origin")"
      - id: snapshot
        run: echo "version=$(curl -fsS "$(node -p "require('./product.json').campusOrigin")/campus-release.json" | node -pe 'JSON.parse(require("fs").readFileSync(0)).version')" >> "$GITHUB_OUTPUT"
      # Snapshot paths are immutable, so the files of the snapshot being deployed are kept between deployments; a code
      # change ships without downloading the campus data again.
      - uses: actions/cache@v5
        with:
          key: campus-snapshot-${{ steps.snapshot.outputs.version }}
          path: |
            public/data
            public/space
            public/search
            public/texts
            public/knowledge
      - name: Read the published campus snapshot
        run: npm run data:pull
      - run: npm run typecheck
      - run: npm run test:campus
      - run: npm run test:platform
      - run: npm run build
      - run: npm run test:site
      # A build identical to the live site is not deployed again.
      - id: identity
        run: |
          id=$(node scripts/release/deployment-id.mjs --write)
          live=$(curl -fsS "$(node -p "require('./product.json').origin")/deployment.txt" || true)
          if [ "$id" = "$live" ]; then echo "the live site is already $id"; echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy
        if: steps.identity.outputs.changed == 'true'
        run: |
          set -o pipefail
          # The EdgeOne API answers 522 now and then; a later try gets through.
          for try in 1 2 3 4; do
            if npx -y edgeone@1.6.44 makers deploy -n studev -t "$EDGEONE_API_TOKEN" --json 2>&1 | tee deploy.log; then exit 0; fi
            grep -q "Deploy Success" deploy.log && break
            [ "$try" = 4 ] && { echo "the deployment itself failed"; exit 1; }
            sleep $((try * 60))
          done
          echo "the CLI failed after the deployment went live; checking the site"
          origin=$(node -p "require('./product.json').origin")
          script=$(grep -o '/_astro/[^\"]*\.js' dist/index.html | head -1)
          for attempt in $(seq 1 20); do
            data=$(curl -s -o /dev/null -w '%{http_code}' "$origin/app-release.json")
            code=$(curl -s -o /dev/null -w '%{http_code}' "$origin$script")
            if [ "$data" = "200" ] && [ "$code" = "200" ]; then echo "serving app metadata and $script"; exit 0; fi
            sleep 15
          done
          echo "the site does not serve app metadata and $script after five minutes"
          exit 1
