name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: read

concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_SOURCE: skills
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      DATA_REPOSITORY: ${{ secrets.DATA_REPOSITORY }}
      OSCA_DOWNLOAD_ENDPOINT: ${{ secrets.OSCA_DOWNLOAD_ENDPOINT }}
      OSCA_DOWNLOAD_BUCKET: ${{ secrets.OSCA_DOWNLOAD_BUCKET }}
      OSCA_DOWNLOAD_ACCESS_KEY: ${{ secrets.OSCA_DOWNLOAD_ACCESS_KEY }}
      OSCA_DOWNLOAD_SECRET_KEY: ${{ secrets.OSCA_DOWNLOAD_SECRET_KEY }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      MAKERS_MODELS_KEY: ${{ secrets.MAKERS_MODELS_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MAP_REPOSITORY: hicancan/njupt-map
    steps:
      - uses: actions/checkout@v6
      - name: Put the released APK on the backup host
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          OSCA_DOWNLOAD_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          OSCA_DOWNLOAD_BUCKET: studev-download
          OSCA_DOWNLOAD_ACCESS_KEY: ${{ secrets.R2_DOWNLOAD_ACCESS_KEY }}
          OSCA_DOWNLOAD_SECRET_KEY: ${{ secrets.R2_DOWNLOAD_SECRET_KEY }}
        run: |
          version=$(node -p "require('./product.json').android.versionName")
          gh release download "v$version" -R "$GITHUB_REPOSITORY" -p "studev-$version.apk" -D "$RUNNER_TEMP"
          node scripts/release/put-apk.mjs "$RUNNER_TEMP/studev-$version.apk" "studev-$version.apk"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure release inputs for the EdgeOne builder
        run: |
          # The CLI reports a missing project link and still exits 0, so link it first.
          mkdir -p .edgeone
          echo '{"Name":"studev","ProjectId":"makers-xubgsi8n79pp"}' > .edgeone/project.json
          # The EdgeOne API drops a call now and then, here as in the deploy below.
          makers() { for try in 1 2 3 4; do npx -y edgeone@1.6.44 makers "$@" -e production -t "$EDGEONE_API_TOKEN" && return 0; sleep $((try * 15)); done; return 1; }
          makers env set DATA_REPOSITORY "$DATA_REPOSITORY"
          makers env set DATA_TOKEN "$DATA_TOKEN"
          for name in OSCA_DOWNLOAD_ENDPOINT OSCA_DOWNLOAD_BUCKET OSCA_DOWNLOAD_ACCESS_KEY OSCA_DOWNLOAD_SECRET_KEY MAKERS_MODELS_KEY NVIDIA_API_KEY; do
            makers env set "$name" "${!name}"
          done
          makers env pull
          grep -q OSCA_DOWNLOAD_BUCKET .env* || { echo "project environment was not updated"; exit 1; }
      # digest resolves and verifies the latest map/data release pair.
      - run: npm run digest
      - run: npm run typecheck
      - run: npm run test:campus
      - run: npm run test:platform
      - run: npm run build
      - run: npm run test:site
      - name: Stage the verified data release for the EdgeOne builder
        run: |
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('src/data/campus-release.json','utf8')); fs.rmSync('public/data-source',{recursive:true,force:true}); fs.cpSync('.data/'+r.data_version,'public/data-source',{recursive:true}); const idx=JSON.parse(fs.readFileSync('public/data-source/index.json','utf8')); idx.version=r.data_version; fs.writeFileSync('public/data-source/index.json',JSON.stringify(idx));"
      - name: Deploy
        run: |
          set -o pipefail
          # The EdgeOne API answers 522 now and then; a later try gets through.
          for try in 1 2 3 4; do
            if npx -y edgeone@1.6.44 makers deploy -n studev -t "$EDGEONE_API_TOKEN" --json 2>&1 | tee deploy.log; then exit 0; fi
            grep -q "Deploy Success" deploy.log && break
            [ "$try" = 4 ] && { echo "the deployment itself failed"; exit 1; }
            sleep $((try * 60))
          done
          echo "the CLI failed after the deployment went live; checking the site"
          base=$(node -p "require('./src/data/campus-release.json').base")
          script=$(grep -o '/_astro/[^\"]*\.js' dist/index.html | head -1)
          for attempt in $(seq 1 20); do
            data=$(curl -s -o /dev/null -w '%{http_code}' "https://studev.hicancan.top$base/rooms/index.json")
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://studev.hicancan.top$script")
            if [ "$data" = "200" ] && [ "$code" = "200" ]; then echo "serving $base and $script"; exit 0; fi
            sleep 15
          done
          echo "the site does not serve $base and $script after five minutes"
          exit 1
