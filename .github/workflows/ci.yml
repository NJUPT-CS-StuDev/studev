name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATA_REPOSITORY: ${{ secrets.DATA_REPOSITORY }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run digest
      - run: npm run typecheck
      - run: npm run test:campus
      - run: npm run test:platform

  android-apk:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATA_REPOSITORY: ${{ secrets.DATA_REPOSITORY }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android SDK and NDK inputs
        run: |
          sdkmanager_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then sdkmanager_path="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-36" "ndk;28.2.13676358"
      - run: npm ci
      - run: npm run digest
      - name: Build native routing and search kernels
        run: bash android/kernels-ci.sh
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon -Pstudev.compileSdk=36
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: studev-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
